services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    env_file:
      - ../.env
    command: >
      sh -c "pip install -r requirements.txt --quiet &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: unless-stopped
