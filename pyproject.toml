[project]
name = "phantom-chat"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
